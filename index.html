<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .timestamp {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
    }

    button {
      margin-top: 20px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 It's live!</h1>
    <p>If you're seeing this, your GitHub Pages deployment is working correctly.</p>
    <div class="status">
      <span class="dot"></span>
      Site is up
    </div>
    <div class="timestamp" id="timestamp"></div>
    <br>
    <button onclick="document.getElementById('click-count').textContent = Number(document.getElementById('click-count').textContent) + 1">
      Clicked <span id="click-count">0</span> times
    </button>
  </div>

  <script>
    document.getElementById('timestamp').textContent =
      'Page loaded at ' + new Date().toLocaleString();
  </script>
</body>
</html>
